<!-- templates/book_appointment.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Appointment</title>
</head>
<body>
  <h2>Book Appointment</h2>
  <form id="appointmentForm">
    <label>Patient ID:</label>
    <input type="number" id="patient_id" required><br><br>

    <label>Doctor ID:</label>
    <input type="number" id="doctor_id" required><br><br>

    <label>Date:</label>
    <input type="datetime-local" id="date" required><br><br>

    <label>Description:</label>
    <textarea id="description" required></textarea><br><br>

    <button type="submit">Book</button>
  </form>

  <p id="responseMessage"></p>

  <script>
    document.getElementById('appointmentForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const data = {
        patient_id: parseInt(document.getElementById('patient_id').value),
        doctor_id: parseInt(document.getElementById('doctor_id').value),
        date: document.getElementById('date').value,
        description: document.getElementById('description').value
      };

      fetch('/patient/book', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(data)
      })
      .then(response => response.json())
      .then(data => {
        document.getElementById('responseMessage').innerText = data.msg || data.error || 'Response received.';
      })
      .catch(error => {
        document.getElementById('responseMessage').innerText = 'Error: ' + error;
      });
    });
  </script>
</body>
</html>
